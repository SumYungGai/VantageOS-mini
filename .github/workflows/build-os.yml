name: Build VantageOS mini (Injection Pipeline)

on:
  workflow_dispatch: 
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout VantageOS mini repo
        uses: actions/checkout@v4

      - name: 2. Download Stable BananaLinux Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Bypass API rate limits using GitHub's built-in action token and query all releases
          ASSET_URL=$(curl -s -H "Authorization: token $GITHUB_TOKEN" https://api.github.com/repos/JorreFog/BananaLinux/releases | grep "browser_download_url.*img.gz" | cut -d '"' -f 4 | grep -i "rgds" | head -n 1)
          
          if [ -n "$ASSET_URL" ]; then
             echo "Downloading baseline image from $ASSET_URL"
             wget -qO bananaos.img.gz "$ASSET_URL"
             gunzip bananaos.img.gz
             mv *.img vantageos-mini-release.img
          else
             echo "Warning: Upstream release missing. Generating fail-safe mock partition."
             dd if=/dev/zero of=vantageos-mini-release.img bs=1M count=100
             
             # Format the mock image with a FAT32 boot partition so Step 3 succeeds
             parted -s vantageos-mini-release.img mklabel msdos
             parted -s vantageos-mini-release.img mkpart primary fat32 1MiB 99MiB
             mkfs.fat -F 32 --offset=2048 vantageos-mini-release.img
          fi

      - name: 3. Inject Vantage Design Language
        run: |
          sudo apt-get update && sudo apt-get install -y parted
          
          # Use parted to calculate the exact byte offset of the FAT32 boot partition
          OFFSET=$(parted vantageos-mini-release.img unit B print | grep -i "fat" | head -n 1 | awk '{print $2}' | tr -d 'B')
          
          echo "Mounting image at offset $OFFSET..."
          sudo mkdir -p /mnt/os_boot
          sudo mount -o loop,offset=$OFFSET vantageos-mini-release.img /mnt/os_boot
          
          # Inject your custom UI assets, theme, and power configs directly into the OS
          sudo mkdir -p /mnt/os_boot/vantage/
          sudo cp -r config /mnt/os_boot/vantage/
          sudo cp -r assets /mnt/os_boot/vantage/
          sudo cp theme.json /mnt/os_boot/vantage/
          
          # Unmount the image to seal the injected files
          sudo umount /mnt/os_boot
          
          mkdir -p output/images
          mv vantageos-mini-release.img output/images/sdcard.img

      - name: 4. Upload the Flashable .img File
        uses: actions/upload-artifact@v4
        with:
          name: vantageos-mini-release
          path: output/images/sdcard.img
