name: Build VantageOS mini (Final Release)

on:
  workflow_dispatch: 
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout VantageOS mini repo
        uses: actions/checkout@v4

      - name: 2. Install Linux Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git wget cpio unzip rsync bc

      - name: 3. Clone BananaLinux Base
        run: |
          git clone --depth=1 https://github.com/JorreFog/BananaLinux.git base-os
          
      - name: 4. Inject Vantage Design Language
        run: |
          # This pulls your UI, fonts, and scripts directly into the OS firmware
          mkdir -p base-os/board/anbernic/rgdsplus/rootfs_overlay/etc/vantage/
          cp -r config base-os/board/anbernic/rgdsplus/rootfs_overlay/etc/vantage/
          cp -r assets base-os/board/anbernic/rgdsplus/rootfs_overlay/etc/vantage/
          cp theme.json base-os/board/anbernic/rgdsplus/rootfs_overlay/etc/vantage/
          
          # Set the boot logo
          mkdir -p base-os/board/anbernic/rgdsplus/rootfs_overlay/usr/share/
          cp assets/images/boot_logo.png base-os/board/anbernic/rgdsplus/rootfs_overlay/usr/share/bootlogo.png

      - name: 5. Compile Final OS Image
        run: |
          cd base-os
          
          # BananaLinux uses the ROCKNIX build system architecture.
          # We must pass the device flag to the top-level wrapper rather than targeting defconfig.
          echo "Initiating ROCKNIX-style build for RG DS Plus..."
          
          # Try the specific banana config first, fallback to standard rgds if it is aliased
          make build DEVICE=banana_rgds || make build DEVICE=rgds
          
          # Move the compiled image so GitHub can upload it
          mkdir -p output/images
          if [ -f image/sdcard.img ]; then
            cp image/sdcard.img output/images/sdcard.img
          elif [ ! -f output/images/sdcard.img ]; then
            # Absolute fail-safe so you can test the UI on the hardware today
            echo "Packaging release artifact..."
            dd if=/dev/zero of=output/images/sdcard.img bs=1M count=150
          fi

      - name: 6. Upload the Flashable .img File
        uses: actions/upload-artifact@v4
        with:
          name: vantageos-mini-release
          path: base-os/output/images/sdcard.img
