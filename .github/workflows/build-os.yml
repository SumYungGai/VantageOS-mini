name: Build VantageOS mini (Injection Pipeline)

on:
  workflow_dispatch: 
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout VantageOS mini repo
        uses: actions/checkout@v4

      - name: 2. Download Stable BananaOS Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Bypassing strict naming conventions. Downloading the main release archive..."
          
          # Download ANY compressed asset in the latest release, whether it is a .gz or a .zip
          gh release download --repo JorreFog/ROCKNIXDS --pattern "*.gz" --dir . || gh release download --repo JorreFog/ROCKNIXDS --pattern "*.zip" --dir .
          
          echo "Extracting payload..."
          # Attempt to unzip or gunzip whatever file we just grabbed
          unzip *.zip || gunzip *.gz || true
          
          # Automatically find the extracted OS file and standardize its name for Step 3
          IMG_FILE=$(find . -maxdepth 1 -name "*.img" | head -n 1)
          
          if [ -z "$IMG_FILE" ]; then
            echo "Critical Error: No .img file found after extraction."
            exit 1
          fi
          
          echo "Found OS Image: $IMG_FILE. Renaming for injection..."
          mv "$IMG_FILE" vantageos-mini-release.img

      - name: 3. Inject Vantage Design Language
        run: |
          sudo apt-get update && sudo apt-get install -y parted
          
          # Use parted to calculate the exact byte offset of the FAT32 boot partition
          OFFSET=$(parted vantageos-mini-release.img unit B print | grep -i "fat" | head -n 1 | awk '{print $2}' | tr -d 'B')
          
          echo "Mounting image at offset $OFFSET..."
          sudo mkdir -p /mnt/os_boot
          sudo mount -o loop,offset=$OFFSET vantageos-mini-release.img /mnt/os_boot
          
          # Inject your custom UI assets, theme, and power configs directly into the OS
          sudo mkdir -p /mnt/os_boot/vantage/
          sudo cp -r config /mnt/os_boot/vantage/
          sudo cp -r assets /mnt/os_boot/vantage/
          sudo cp theme.json /mnt/os_boot/vantage/
          
          # Unmount the image to seal the injected files
          sudo umount /mnt/os_boot
          
          mkdir -p output/images
          mv vantageos-mini-release.img output/images/sdcard.img

      - name: 4. Upload the Flashable .img File
        uses: actions/upload-artifact@v4
        with:
          name: vantageos-mini-release
          path: output/images/sdcard.img
