[Storage]
# 2-Card Setup: Tells VantageOS to mount the 128GB card for ROMs and Saves
rom_drive = TF2
auto_mount = true

[Emulation_DS]
# Using DraStic for maximum RK3568 performance at higher resolutions
core = drastic_vantage_optimized
screens = dual_display
top_screen_res = 1024x768
bottom_screen_res = 1024x768
internal_3d_scale = 2x

[Hotkeys_Global]
# Universal intercept mappings for the RG DS Plus hardware
quick_menu = START+SELECT
fast_forward = R2
save_state = SELECT+R1
load_state = SELECT+L1
cheat_toggle = SELECT+Y
